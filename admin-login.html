<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JATAV Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f3f7ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.login-box{

width:400px;
max-width:95%;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.logo{

text-align:center;
font-size:34px;
font-weight:bold;
color:#0056d2;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:30px;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;
margin-bottom:6px;
font-size:14px;
font-weight:bold;
color:#333;

}

.input-box input{

width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
outline:none;

}

.input-box input:focus{

border-color:#0056d2;

}

.password-box{

position:relative;

}

.password-box span{

position:absolute;
right:15px;
top:14px;
cursor:pointer;
font-size:14px;
color:#0056d2;

}

button{

width:100%;
padding:14px;
background:#0056d2;
color:white;
font-size:17px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#003ea8;

}

#error{

margin-top:15px;
text-align:center;
color:red;
font-size:14px;

}

footer{

margin-top:25px;
text-align:center;
font-size:13px;
color:#777;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
JATAV
</div>


<div class="subtitle">
Admin & Staff Login
</div>


<div class="input-box">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>


<div class="input-box">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter Password">

<span onclick="showPassword()">
Show
</span>

</div>

</div>


<button onclick="loginUser()">
Login
</button>


<div id="error"></div>


<footer>
© 2026 JATAV
</footer>


</div>


<!-- FIREBASE AUTH -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBlvX3jU0-rcBmK803MDxf0xN8f4C0049g",

authDomain: "jatav-7b9f8.firebaseapp.com",

databaseURL: "https://jatav-7b9f8-default-rtdb.firebaseio.com",

projectId: "jatav-7b9f8",

storageBucket: "jatav-7b9f8.firebasestorage.app",

messagingSenderId: "337613651577",

appId: "1:337613651577:web:d8159dc0cf3de766da9ea8",

measurementId: "G-NXEHPZ992X"

};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* SHOW PASSWORD */

window.showPassword = function(){

const p = document.getElementById("password");

if(p.type === "password"){

p.type = "text";

}else{

p.type = "password";

}

};


/* LOGIN */

window.loginUser = async function(){

const errorBox =
document.getElementById("error");

errorBox.innerHTML = "";

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value.trim();


if(email === "" || password === ""){

errorBox.innerHTML =
"Please fill all fields.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);


localStorage.setItem(
"adminLogin",
"true"
);

localStorage.setItem(
"adminEmail",
email
);

localStorage.setItem(
"adminRole",
"admin"
);


window.location.href =
"dashboard.html";


}catch(error){

console.error(error);

errorBox.innerHTML =
"Invalid Email or Password.";

}

};

</script>


</body>

</html>
